/* ============================================================
   6. Pantalla de la clienta — flujo de reserva
   Pasos: 1 con quién · 2 servicio · 3 día · 4 hora · 5 datos ·
          6 depósito (solo si pideDeposito) · 7 confirmación.
   El 1 se salta si hay una sola profesional activa.
   ============================================================ */
const PASOS = {1:'Profesional', 2:'Servicio', 3:'Día', 4:'Hora', 5:'Datos', 6:'Depósito'};

/* El paso del nivel de diseño va entre servicio (2) y día (3); solo aparece si algún servicio elegido admite diseño */
const PASO_DISENIO = 2.5;
function pasosVisibles(){
  const l = [];
  if(profsActivas().length > 1) l.push(1);
  l.push(2);
  if(necesitaDisenio()) l.push(PASO_DISENIO);
  l.push(3,4,5);
  if(S.config.pideDeposito) l.push(6);
  return l;
}
/* Encabezado del recorrido: la marca, en qué paso va (es una secuencia
   real, por eso lleva número) y la salida. La línea de abajo es el avance. */
function encReserva(){
  const l = pasosVisibles(), i = l.indexOf(V.paso);
  const avance = V.paso >= 7 ? 100 : Math.round(((i < 0 ? l.length : i+1) / l.length) * 100);
  return '<header class="v-enc"><span class="v-marca">VAZÚ</span>'+
    (i >= 0 ? '<span class="v-paso">Paso '+(i+1)+' de '+l.length+'</span>' : '')+
    '<button class="v-x" onclick="irInicio()" aria-label="Salir de la reserva">'+ICO_X+'</button>'+
    '<span class="v-prog" aria-hidden="true"><i style="width:'+avance+'%"></i></span></header>';
}
function tituloPaso(t){ return '<h1 class="v-h1">'+t+'</h1>'; }

function verCliente(){
  let h = encReserva();
  h += '<main class="v-cuerpo">';
  if(V.paso === 1) h += pasoProfesional();
  if(V.paso === 2) h += pasoServicios();
  if(V.paso === PASO_DISENIO) h += pasoNivel();
  if(V.paso === 3) h += pasoDia();
  if(V.paso === 4) h += pasoHora();
  if(V.paso === 5) h += pasoDatos();
  if(V.paso === 6) h += pasoDeposito();
  if(V.paso === 7) h += pasoConfirmado();
  h += '</main>';
  // el pie (contacto y acceso al panel) vive solo en la portada: en la reserva distrae
  return h;
}

function pie(){
  return '<footer class="v-pie">'+
    '<p>VAZÚ Nails Beauty<br>'+esc(S.config.direccion)+'</p>'+
    '<p><a href="'+enlaceWA(saludoWA())+'" target="_blank" rel="noopener">WhatsApp '+esc(S.config.telefono)+'</a><br>'+
    '<a href="'+urlIG()+'" target="_blank" rel="noopener">@'+esc(S.config.instagram)+'</a></p>'+
    '<button class="v-adm" onclick="pedirPin()">Panel del estudio</button></footer>';
}

/* --- Paso 1: con quién. Dos mitades, como dos puestos. --- */
function pasoProfesional(){
  const lista = profsActivas();
  let h = tituloPaso('¿Con quién?');
  h += '<p class="v-bajada">Elegí a tu manicurista o dejá que te toque la primera que esté libre.</p>';
  h += '<div class="v-mitades">';
  for(const p of lista){
    const on = V.prof === p.id;
    // la foto real de cada una (valeria.jpg, melissa.jpg). Si no está el archivo, queda solo el nombre.
    h += '<button class="v-mitad'+(on?' sel':'')+'" aria-pressed="'+on+'" onclick="elegirProf(\''+p.id+'\')">'+
      '<span class="v-mitad-foto"><img src="'+encodeURI(fotoProf(p))+'" alt="" onerror="this.parentNode.remove()"></span>'+
      '<span class="v-mitad-nom">'+esc(p.nombre)+'</span>'+
      '<span class="v-raya" style="background:'+esc(p.color)+'"></span>'+
      '<span class="v-meta">Ver su agenda</span></button>';
  }
  h += '</div>';
  const on = V.prof === 'cualquiera';
  h += '<button class="v-cualquiera'+(on?' sel':'')+'" aria-pressed="'+on+'" onclick="elegirProf(\'cualquiera\')">'+
    '<span class="v-nom">La primera que esté libre</span>'+
    '<span class="v-meta">Buscamos en las agendas de '+(lista.length===2?'las dos':'todas')+
    ' y te mostramos quién te atiende en cada hora.</span></button>';
  return h + barraInferior();
}

/* "Con Valeria" y el botón para cambiarla, arriba de los pasos siguientes */
function conQuien(){
  if(profsActivas().length < 2 || !V.prof) return '';
  const txt = V.prof === 'cualquiera' ? 'Con la primera que esté libre' : 'Con '+esc(nombreProf(V.prof));
  return '<p class="v-con">'+(V.prof==='cualquiera' ? '' : punto(colorProf(V.prof)))+txt+
    '<button class="v-link-btn" onclick="irPaso(1)">Cambiar</button></p>';
}

/* --- Paso 2: el menú hecho interactivo (hasta dos servicios) + extras --- */
function pasoServicios(){
  let h = tituloPaso('¿Qué te vas a hacer?');
  h += conQuien();
  h += '<p class="v-bajada">Hasta dos servicios en la misma cita, por ejemplo manos y pies. Se hacen uno seguido del otro.</p>';
  // lo que pasó con el último toque (por ejemplo "Gel X ya incluye manicure ruso: lo quitamos de tu cita.")
  if(V.notaServ) h += '<p class="v-nota-serv" role="status">'+esc(V.notaServ)+'</p>';
  else if(V.sel.length === 2) h += '<p class="v-tope">Ya elegiste dos. Para cambiar uno, quitá el que no querés.</p>';
  // con una profesional específica, solo lo que ella hace
  const p = V.prof && V.prof !== 'cualquiera' ? prof(V.prof) : null;
  const disponible = s => p ? hace(p, s) : profsActivas().some(x => hace(x, s));
  for(const cat of CATEGORIAS){
    if(cat.id === 'extras') continue;
    const lista = S.servicios.filter(s => s.cat === cat.id && disponible(s));
    if(!lista.length) continue;
    h += '<h2 class="v-cat">'+esc(cat.n)+'</h2><div class="v-lista">';
    for(const s of lista){
      const on = V.sel.includes(s.id);
      // se puede tocar si las reglas lo permiten (una variante del pedicure sí cambia la otra aunque ya haya dos)
      const tope = !on && !!aplicarReglas(V.sel, s.id).error;
      const motivo = on ? null : motivoBloqueo(s.id, V.sel);
      const incluye = (s.incluye||[]).map(servicio).filter(Boolean).map(nomCorto);
      h += '<div class="v-fila elegible'+(on?' sel':'')+(tope?' tope':'')+'">'+
        '<button class="v-fila-cab" '+(tope?'disabled':'')+' aria-pressed="'+on+'" onclick="tocarServicio(\''+s.id+'\')">'+
          filaFoto(s)+
          '<span class="v-txt"><span class="v-nom">'+esc(s.nombre)+'</span>'+
            '<span class="v-meta">'+durTxt(s)+(incluye.length ? (durTxt(s).endsWith('.') ? ' ' : '. ')+'Incluye '+esc(incluye.join(' y ')) : '')+'</span>'+
            (motivo ? '<span class="v-motivo">'+esc(motivo)+'</span>' : '')+'</span>'+
          '<span class="v-precio">'+col(s.precio)+'<span class="v-caja" aria-hidden="true">'+ICO.check+'</span></span>'+
        '</button>'+
        '<div class="v-desc">'+descHTML('r'+s.id, s.desc)+'</div>'+
      '</div>';
    }
    h += '</div>';
    if(cat.nota) h += '<p class="v-nota-cat">'+esc(cat.nota)+'</p>';
  }

  if(S.adicionales.length){
    h += '<h2 class="v-cat">Extras</h2><div class="v-lista">';
    for(const a of S.adicionales){
      const on = (V.adic[a.id]||0) > 0;
      h += '<div class="v-fila elegible'+(on?' sel':'')+'">'+
        '<button class="v-fila-cab" aria-pressed="'+on+'" onclick="ponAdic(\''+a.id+'\','+(on?0:1)+')">'+
          filaFoto(a)+
          '<span class="v-txt"><span class="v-nom">'+esc(a.nombre)+'</span><span class="v-meta">Opcional. '+durTxt(a, true)+'</span></span>'+
          '<span class="v-precio">'+capital(precioAdic(a))+'<span class="v-caja" aria-hidden="true">'+ICO.check+'</span></span>'+
        '</button>'+
        '<div class="v-desc">'+descHTML('r'+a.id, a.desc)+'</div>';
      if(on){
        h += '<div class="v-campo v-disenio"><label for="f-disenio">Contanos el diseño que querés</label>'+
          '<textarea class="inp" id="f-disenio" maxlength="400" placeholder="Por ejemplo: aerógrafo en dos uñas, efecto aurora en todas" '+
          'oninput="V.disenio=this.value">'+esc(V.disenio)+'</textarea></div>';
      }
      h += '</div>';
    }
    h += '</div><p class="v-nota-cat">'+esc(NOTA_EXTRAS)+'</p>';
  }

  if(V.sel.length === 2 && S.config.pideDeposito){
    h += '<p class="v-nota-cat">Dos servicios en la misma cita: el depósito es de '+col(2*S.config.depositoPorServicio)+
      ', '+col(S.config.depositoPorServicio)+' por cada uno.</p>';
  }
  return h + barraInferior();
}

/* --- Paso 2.5: qué tan elaborado es el diseño. Cambia el tiempo, no el precio. --- */
function pasoNivel(){
  const nServ = serviciosConDisenio().length;
  let h = tituloPaso('¿Qué tan elaborado es tu diseño?');
  h += conQuien();
  h += '<p class="v-bajada">Con esto te reservamos el tiempo justo. El precio no cambia; los diseños especiales se cotizan aparte, en Extras.</p>';
  h += '<div class="v-lista v-niveles" role="radiogroup" aria-label="Nivel de diseño">';
  for(const n of S.config.nivelesDisenio){
    const on = V.nivel === n.id;
    const suma = n.min * nServ;
    h += '<div class="v-fila elegible'+(on?' sel':'')+'">'+
      '<button class="v-fila-cab v-nivel" role="radio" aria-checked="'+on+'" onclick="elegirNivel(\''+n.id+'\')">'+
        '<span class="v-txt"><span class="v-nom">'+esc(n.n)+'</span>'+
        '<span class="v-meta">'+(suma ? 'Suma '+dur(suma)+(nServ > 1 ? ' entre tus dos servicios' : '') : 'No suma tiempo')+'</span></span>'+
        '<span class="v-precio"><span class="v-caja v-radio" aria-hidden="true">'+ICO.check+'</span></span>'+
      '</button></div>';
  }
  h += '</div>';

  h += '<h2 class="v-grupo">Foto de referencia <span class="v-meta">(opcional)</span></h2>';
  h += '<p class="v-bajada">Si tenés una foto del diseño que querés, adjuntala. La ve tu manicurista antes de confirmar.</p>';
  h += '<input type="file" id="f-ref" class="v-oculto-input" accept="image/*" onchange="tomarCaptura(this,\'refDisenio\')">'+
    '<label class="v-adjunto" for="f-ref">'+
      (V.refDisenio ? '<img src="'+V.refDisenio+'" alt="Tu foto de referencia"><span>Foto adjunta. Tocá para cambiarla.</span>'
                    : ICO.clip+'<span>Adjuntar una foto de referencia</span>')+
    '</label>';
  if(V.refDisenio) h += '<button class="v-link-btn" style="margin-top:8px" onclick="V.refDisenio=null;pintar()">Quitar la foto</button>';

}

/* --- Paso 3: día --- */
function pasoDia(){
  const t = totalSel();
  if(!V.mes){ const p = partesCR(); const d = deYMD(p.ymd); V.mes = {y:d.getUTCFullYear(), m:d.getUTCMonth()}; }
  let h = tituloPaso('Elegí el día');
  h += conQuien();
  h += '<p class="v-bajada">Se pueden elegir los días donde caben '+dur(t.minutos)+' seguidos. Los demás aparecen en gris.</p>';
  h += calendario();
  return h + barraInferior();
}

function calendario(){
  const t = totalSel();
  const {y,m} = V.mes;
  const hoy = hoyCR();
  const primero = new Date(Date.UTC(y,m,1));
  const dias = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const desfase = (primero.getUTCDay()+6)%7;                     // semana inicia lunes
  const pMes = partesCR(); const dHoy = deYMD(pMes.ymd);
  const atras = (y === dHoy.getUTCFullYear() && m === dHoy.getUTCMonth());
  const maxFecha = sumarDias(hoy, S.config.diasAdelante || 60);
  const proxMes = new Date(Date.UTC(y,m+1,1)).toISOString().slice(0,10);
  const adelante = proxMes > maxFecha;
  const idx = indiceOcupado();                                   // una sola vez por repintado

  let h = '<div class="v-cal-enc">'+
    '<button class="v-flecha" '+(atras?'disabled':'')+' onclick="moverMes(-1)" aria-label="Mes anterior">'+ICO.flechaI+'</button>'+
    '<h2>'+capital(MESES[m])+' '+y+'</h2>'+
    '<button class="v-flecha" '+(adelante?'disabled':'')+' onclick="moverMes(1)" aria-label="Mes siguiente">'+ICO.flechaD+'</button>'+
  '</div><div class="v-cal">';
  for(const d of ['L','M','M','J','V','S','D']) h += '<div class="v-dow" aria-hidden="true">'+d+'</div>';
  for(let i=0;i<desfase;i++) h += '<div></div>';
  for(let d=1;d<=dias;d++){
    const f = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const fuera = f < hoy || f > maxFecha;
    const libre = !fuera && espaciosCliente(f, t.minutos, idx).length > 0;
    h += '<button class="v-dia'+(V.fecha===f?' sel':'')+(f===hoy?' hoy':'')+'" '+(libre?'':'disabled')+
         ' aria-pressed="'+(V.fecha===f)+'" aria-label="'+capital(fechaLarga(f))+(libre?'':', sin espacio')+'"'+
         ' onclick="elegirDia(\''+f+'\')">'+d+'</button>';
  }
  return h+'</div>';
}

/* --- Paso 4: hora (si es "la primera libre", dice quién atiende) --- */
function pasoHora(){
  const t = totalSel();
  const libres = espaciosCliente(V.fecha, t.minutos);
  const muestraQuien = V.prof === 'cualquiera';
  let h = tituloPaso('Elegí la hora');
  h += conQuien();
  h += '<p class="v-fecha">'+capital(fechaLarga(V.fecha))+'<br><span>'+dur(t.minutos)+' de atención</span></p>';
  if(V.errores.hora){
    h += '<div class="v-error" role="alert"><strong>Ese espacio ya no está disponible.</strong>'+esc(V.errores.hora)+'</div>';
  }
  if(!libres.length){
    h += '<p class="v-bajada">Ese día se llenó mientras elegías. Elegí otro día.</p>';
    h += '<button class="v-btn sec" onclick="irPaso(3)">Ver otros días</button>';
    return h + barraInferior();
  }
  const celda = x => {
    const on = V.hora===x.t && V.horaProf===x.prof;
    const [hh, ap] = hora12(x.t).split(' ');
    return '<button class="v-hora'+(on?' sel':'')+'" aria-pressed="'+on+'" onclick="elegirHora('+x.t+',\''+x.prof+'\')">'+
      '<span class="v-h">'+hh+'<small> '+ap+'</small></span>'+
      (muestraQuien ? '<span class="v-quien">'+punto(colorProf(x.prof))+esc(nombreProf(x.prof))+'</span>' : '')+
    '</button>';
  };
  const manana = libres.filter(x=>x.t<12*60), tarde = libres.filter(x=>x.t>=12*60);
  if(manana.length) h += '<h2 class="v-grupo">Mañana</h2><div class="v-horas">'+manana.map(celda).join('')+'</div>';
  if(tarde.length)  h += '<h2 class="v-grupo">Tarde</h2><div class="v-horas">'+tarde.map(celda).join('')+'</div>';
  if(V.hora!=null) h += '<p class="v-bajada v-fin">'+(V.horaProf?'Te atiende '+esc(nombreProf(V.horaProf))+'. ':'')+
    'Terminás cerca de '+alaHora(aHora(V.hora+t.minutos))+'</p>';   // la hora ya termina en "p.m."
  return h + barraInferior();
}

/* --- Paso 5: datos --- */
function pasoDatos(){

  let h = tituloPaso('Tus datos');

    (e.nombre?'<p class="v-err">'+e.nombre+'</p>':'')+'</div>';

  h += '<div class="v-campo"><label for="f-tel">Teléfono</label><div class="v-tel">'+

    '<input class="inp '+(e.tel?'mal':'')+'" id="f-tel" inputmode="tel" autocomplete="tel-national" value="'+esc(c.tel)+'" placeholder="'+(pais(c.pais).len===8?'8888 8888':'')+'"'+(e.tel?' aria-invalid="true"':'')+' oninput="V.cliente.tel=this.value">'+
    '</div>'+(e.tel?'<p class="v-err">'+e.tel+'</p>':'')+'</div>';
  h += '<div class="v-campo"><label for="f-email">Correo electrónico</label>'+
    '<input class="inp '+(e.email?'mal':'')+'" id="f-email" inputmode="email" autocomplete="email" autocapitalize="off" value="'+esc(c.email)+'"'+(e.email?' aria-invalid="true"':'')+' oninput="V.cliente.email=this.value">'+
    (e.email?'<p class="v-err">'+e.email+'</p>':'')+'</div>';
  if(e.limite){
    h += '<div class="v-error" role="alert"><strong>No se puede reservar otro espacio todavía.</strong>'+e.limite+' '+
      (conDep ? 'Si ya hiciste el depósito, mandanos el comprobante por WhatsApp al '+esc(S.config.telefono)+'.'
              : 'Si tenés dudas, escribinos por WhatsApp al '+esc(S.config.telefono)+'.')+'</div>';
  }else if(conDep){

  }else{

/* --- Paso 6: depósito (bloquea el horario). Solo con pideDeposito. --- */
function pasoDeposito(){
  const c = S.citas.find(x=>x.id===V.citaId);
  if(!c) return tituloPaso('No encontramos esta reserva')+
    '<p class="v-bajada">Empezá de nuevo para elegir día y hora.</p><button class="v-btn" onclick="reiniciarFlujo()">Empezar de nuevo</button>';

  if(c.estado === 'expirada'){
    return tituloPaso('El apartado venció')+
      '<p class="v-bajada">Pasaron las '+S.config.horasApartado+' horas sin que llegara el comprobante. El espacio del '+
      fechaLarga(c.fecha).toLowerCase()+' a '+alaHora(c.hora)+' quedó libre otra vez.</p>'+
      '<button class="v-btn" onclick="irPaso(3)">Elegir otro día u hora</button>';
  }

  let h = tituloPaso('Apartado');
  h += '<div class="v-reloj"><span class="v-reloj-t" data-cuenta="'+c.id+'">'+cuenta(c.apartadoHasta)+'</span>'+
    '<p>Tu espacio queda apartado '+S.config.horasApartado+' horas mientras mandás el depósito. Nadie más lo puede tomar en ese rato.</p></div>';

  h += resumenCita(c, true);

  h += '<div class="v-sinpe">'+
    '<p class="v-meta">Depósito por SINPE Móvil</p>'+
    '<p class="v-monto">'+col(c.deposito)+'</p>'+
    '<p class="v-meta">'+c.servicios.length+' servicio'+(c.servicios.length>1?'s':'')+' por '+col(S.config.depositoPorServicio)+
      '. Se descuenta del total el día de la cita.</p>'+
    '<div class="v-sinpe-num"><span>'+esc(S.config.sinpe)+'</span>'+
      '<button class="v-link-btn" onclick="copiar(\''+esc(S.config.sinpe).replace(/[^0-9-]/g,'')+'\')">Copiar número</button></div>'+
    '<p class="v-meta">A nombre de '+esc(S.config.titular)+'. En el detalle del SINPE escribí tu nombre completo.</p>'+
  '</div>';

  h += '<h2 class="v-grupo">Comprobante</h2>';
  h += '<div class="v-campo"><label for="f-comp">Número de comprobante</label>'+
    '<input class="inp '+(V.errores.comp?'mal':'')+'" id="f-comp" inputmode="numeric" value="'+esc(V.comprobante)+'" oninput="V.comprobante=this.value">'+
    (V.errores.comp?'<p class="v-err">'+V.errores.comp+'</p>':'')+'</div>';
  h += '<input type="file" id="f-captura" class="v-oculto-input" accept="image/*" onchange="tomarCaptura(this)">'+
    '<label class="v-adjunto" for="f-captura">'+
      (V.captura ? '<img src="'+V.captura+'" alt="Captura del comprobante"><span>Captura adjunta. Tocá para cambiarla.</span>'
                 : ICO.clip+'<span>Adjuntar la captura del comprobante <span class="v-meta">(opcional)</span></span>')+
    '</label>';

  h += '<div class="v-acciones"><button class="v-btn" onclick="enviarComprobante()">Ya hice el depósito</button>'+
    '<button class="v-link-btn v-cancelar" onclick="soltarApartado()">Cancelar y liberar el espacio</button></div>';
  return h;
}

/* --- Paso 7: confirmación. El título repite el verbo del botón. --- */
function pasoConfirmado(){
  const c = S.citas.find(x=>x.id===V.citaId);
  if(!c) return tituloPaso('No encontramos esta reserva')+'<button class="v-btn" onclick="reiniciarFlujo()">Volver al inicio</button>';
  const conDep = c.deposito > 0, quien = esc(nombreProf(c.prof));
  let h = '<h1 class="v-h1 grande">'+(conDep ? 'Depósito enviado' : 'Reservado')+'</h1>';
  h += '<p class="v-bajada">'+(conDep ? quien+' revisa el comprobante y te confirma por WhatsApp. Tu espacio queda bloqueado mientras tanto.'
                                      : 'Falta que '+quien+' la confirme por WhatsApp. Tu espacio ya queda bloqueado.')+'</p>';
  h += resumenCita(c, true);
  h += '<h2 class="v-grupo">Dónde</h2><p class="v-donde">'+esc(S.config.direccion)+', Costa Rica. La dirección exacta te la enviamos al confirmar.</p>';
  h += '<div class="v-acciones"><button class="v-btn" onclick="abrirWhatsApp(\''+c.id+'\')">'+ICO.wa+'Enviar el resumen por WhatsApp</button>'+
    '<button class="v-btn sec" onclick="reiniciarFlujo()">Volver al inicio</button></div>';
  return h;
}

/* Resumen de una cita, como una cuenta: filas y línea fina */
function resumenCita(c, conFecha){
  let h = '<div class="v-resumen">';
  if(conFecha){
    h += '<div class="v-res-cab"><span>'+capital(fechaLarga(c.fecha))+'</span><span class="v-num">'+hora12(aMin(c.hora))+'</span></div>'+
      '<p class="v-con v-res-con">'+punto(colorProf(c.prof))+'Con '+esc(nombreProf(c.prof))+'</p>';
  }
  for(const s of c.servicios) h += '<div class="v-lin"><span>'+esc(nomServ(s))+'</span><span class="v-num">'+col(s.precio)+'</span></div>';
  for(const a of (c.adicionales||[])) h += '<div class="v-lin"><span>'+esc(a.nombre)+(a.cant>1?' × '+a.cant:'')+'</span><span class="v-num">'+capital(precioAdic(a))+'</span></div>';
  if(c.nivel) h += '<div class="v-lin sub"><span>'+esc(c.nivel.n)+'</span><span class="v-num">'+(c.nivel.suma ? 'suma '+dur(c.nivel.suma) : 'sin tiempo extra')+'</span></div>';
  if(c.refDisenio) h += '<div class="v-ref"><img src="'+c.refDisenio+'" alt="Tu foto de referencia"><span class="v-meta">Tu foto de referencia</span></div>';
  if(c.disenio) h += '<p class="v-meta v-res-nota">Diseño: '+esc(c.disenio)+'</p>';
  h += '<div class="v-lin sub"><span>Duración</span><span class="v-num">'+dur(c.duracion)+'</span></div>';
  h += '<div class="v-lin tot"><span>Total'+(tieneConsulta(c)?' de servicios':'')+'</span><span class="v-num">'+col(c.total)+'</span></div>';
  if(tieneConsulta(c)) h += '<p class="v-meta v-res-nota">'+esc(NOTA_EXTRAS)+'</p>';
  if(c.deposito > 0){
    h += '<div class="v-lin sub"><span>Depósito para apartar</span><span class="v-num">'+col(c.deposito)+'</span></div>';
    h += '<div class="v-lin sub"><span>Se paga en el estudio</span><span class="v-num">'+col(c.total - c.deposito)+'</span></div>';
  }
  return h+'</div>';
}

function barraInferior(){
  const t = totalSel();
  const l = pasosVisibles(), prev = l[l.indexOf(V.paso)-1];
  let listo = false, txt = 'Continuar';
  if(V.paso === 1){ listo = !!V.prof; txt = V.prof ? 'Continuar' : 'Elegí con quién'; }
  if(V.paso === 2){ listo = V.sel.length > 0; txt = V.sel.length ? 'Continuar' : 'Elegí tu servicio'; }
  if(V.paso === PASO_DISENIO){ listo = !!nivelDisenio(V.nivel); txt = listo ? 'Continuar' : 'Elegí el nivel de diseño'; }
  if(V.paso === 3){ listo = !!V.fecha; txt = V.fecha ? 'Continuar' : 'Elegí un día'; }
  if(V.paso === 4){ listo = V.hora != null; txt = V.hora != null ? 'Continuar' : 'Elegí una hora'; }
  if(V.paso === 5){ listo = true; txt = S.config.pideDeposito ? 'Apartar con depósito' : 'Reservar'; }
  let h = '<div class="v-barra"><div class="v-barra-in">';
  if((V.sel.length && V.paso > 1) || prev){
    h += '<div class="v-barra-res">';
    if(V.sel.length && V.paso > 1){
      h += '<span class="v-num v-total">'+col(t.precio)+'</span>'+(t.consultar?'<span class="v-meta">+ extras a consultar</span>':'');
    }
    if(prev) h += '<button class="v-link-btn v-atras" onclick="irPaso('+prev+')">Atrás</button>';
    if(V.sel.length && V.paso > 1){
      h += '<span class="v-meta v-barra-det">'+dur(t.minutos)+
        (V.fecha && V.paso>=4 ? ', '+fechaCorta(V.fecha).toLowerCase()+(V.hora!=null?' a '+alaHora(aHora(V.hora)):'') : '')+'</span>';
    }
    h += '</div>';
  }
  h += '<button class="v-btn" '+(listo?'':'disabled')+' onclick="siguiente()">'+txt+'</button>';
  return h+'</div></div>';
}
function vacio(txt, ico){
  return '<div class="vacio"><div class="ic">'+(ICO[ico]||ICO.hoja)+'</div>'+txt+'</div>';
}

/* ============================================================
   7. Acciones del flujo
   ============================================================ */
function elegirProf(id){
  V.prof = id;
  // si cambia de profesional, se quitan los servicios que la nueva no hace
  const p = id !== 'cualquiera' ? prof(id) : null;
  if(p) V.sel = V.sel.filter(sid => hace(p, servicio(sid)));
  V.hora = null; V.horaProf = null;
  irPaso(2);
}
function tocarServicio(id){
  const r = aplicarReglas(V.sel, id);
  // el aviso queda escrito arriba de la lista hasta el próximo cambio (no se pierde como un aviso flotante)
  V.notaServ = r.error || r.aviso || null;
  if(!r.error){ V.sel = r.sel; V.hora = null; }
  const y = window.scrollY; pintar(); window.scrollTo(0,y);
}
function ponAdic(id,q){
  q = Math.max(0, Math.min(1, q));                  // los extras son una casilla
  if(q === 0){ delete V.adic[id]; V.disenio = ''; } else V.adic[id] = q;
  V.hora = null;
  const y = window.scrollY; pintar(); window.scrollTo(0,y);
  if(q){ const e = document.getElementById('f-disenio'); if(e) e.focus({preventScroll:true}); }
}
function elegirDia(f){ V.fecha = f; V.hora = null; V.horaProf = null; pintar(); }
function elegirHora(x, p){ V.hora = x; V.horaProf = p; V.errores = {}; pintar(); }
function moverMes(n){
  let {y,m} = V.mes; m += n;
  if(m < 0){ m = 11; y--; } if(m > 11){ m = 0; y++; }
  V.mes = {y,m}; pintar();
}
function irPaso(p){
  if(p <= 5 && V.citaId) soltarApartado(true);
  V.paso = p; V.errores = {}; V.notaServ = null;
  window.scrollTo(0,0);
  pintar();
}
function siguiente(){
  if(V.paso === 1 && !V.prof) return;
  if(V.paso === 2 && !V.sel.length) return;
  if(V.paso === PASO_DISENIO && !nivelDisenio(V.nivel)) return;
  if(V.paso === 3 && !V.fecha) return;
  if(V.paso === 4 && V.hora == null) return;
  if(V.paso === 5){ if(!validarDatos()) { pintar(); return; } crearApartado(); return; }
  // el siguiente de la lista: así se salta el nivel de diseño cuando no aplica
  const l = pasosVisibles();
  irPaso(l[l.indexOf(V.paso) + 1]);
}
function elegirNivel(id){ V.nivel = id; V.hora = null; const y = window.scrollY; pintar(); window.scrollTo(0,y); }
function validarDatos(){
  const c = V.cliente, e = {};
  if(c.nombre.trim().split(/\s+/).filter(Boolean).length < 2) e.nombre = 'Escribí tu nombre y apellido.';
  const dig = c.tel.replace(/\D/g,''), p = pais(c.pais);
  if(dig.length !== p.len) e.tel = 'El teléfono de '+p.n+' lleva '+p.len+' dígitos.';
  if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(c.email.trim())) e.email = 'Revisá el correo.';
  V.errores = e;
  return Object.keys(e).length === 0;
}

function nuevoId(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* Congela precios y duraciones dentro de la cita: el histórico no cambia
   si mañana suben la lista de precios. */
const soloDigitos = s => String(s||'').replace(/\D/g,'');

/* Reservas sin confirmar que ya tiene esta persona, por teléfono o correo */
function apartadosDe(tel, email){
  const t = soloDigitos(tel), e = (email||'').trim().toLowerCase();
  return S.citas.filter(c =>
    (c.estado === 'pendiente' || (c.estado === 'apartada' && bloquea(c))) &&
    ((t && soloDigitos(c.cliente.tel).endsWith(t.slice(-8))) ||
     (e && (c.cliente.email||'').trim().toLowerCase() === e))
  );
}

/* Crea la cita. Con depósito queda 'apartada' con reloj y pasa a la pantalla
   del SINPE; sin depósito queda 'pendiente' y va directo a la confirmación.
   En los dos casos bloquea el horario de esa profesional. */
function crearApartado(){
  sincronizar();                                     // por si alguien reservó en otra pestaña
  const t = totalSel();
  const libres = espaciosCliente(V.fecha, t.minutos);
  let hueco = libres.find(x => x.t === V.hora && x.prof === V.horaProf);
  // con "la primera disponible", si a quien le tocaba ya no puede, la atiende otra
  if(!hueco && V.prof === 'cualquiera') hueco = libres.find(x => x.t === V.hora);
  if(!hueco){
    const quien = nombreProf(V.horaProf);
    const otra = V.prof !== 'cualquiera' &&
      profsPara(V.sel).find(p => p.id !== V.horaProf && espacios(V.fecha, t.minutos, {prof:p.id}).includes(V.hora));
    // hora12 ya termina en "a.m." / "p.m.": no lleva otro punto
    const msg = quien+' ya tiene una cita el '+fechaLarga(V.fecha).toLowerCase()+' a las '+hora12(V.hora)+' '+
      (otra ? 'Elegí otra hora, o reservá esa misma hora con '+otra.nombre+'.' : 'Elegí otra hora.');
    aviso('Ese espacio ya no está disponible');
    V.hora = null; V.horaProf = null; V.paso = 4; V.errores = {hora:msg};
    window.scrollTo(0,0); pintar(); return;
  }
  const conDep = !!S.config.pideDeposito;
  const previos = apartadosDe(V.cliente.tel, V.cliente.email);
  if(previos.length >= (S.config.maxApartados || 2)){
    V.errores = {limite:
      'Ya tenés '+previos.length+' reserva'+(previos.length>1?'s':'')+' sin confirmar ('+
      previos.map(c=>fechaCorta(c.fecha)+' a las '+hora12(aMin(c.hora))).join(' y ')+
      '). '+(conDep ? 'Completá el depósito de '+(previos.length>1?'esas':'esa')+' antes de apartar otra.'
                    : 'Esperá a que te '+(previos.length>1?'las':'la')+' confirmemos antes de pedir otra.')};
    V.paso = 5; window.scrollTo(0,0); pintar(); return;
  }
  const p = pais(V.cliente.pais);
  const c = {
    id:nuevoId(),
    prof:hueco.prof,
    fecha:V.fecha,
    hora:aHora(V.hora),
    duracion:t.minutos,
    servicios:V.sel.map(id=>{ const s=servicio(id); return {id:s.id, cat:s.cat, nombre:s.nombre, precio:s.precio, min:s.min}; }),
    adicionales:Object.keys(V.adic).map(id=>{ const a=adicional(id); return {id:a.id, nombre:a.nombre, precio:a.precio, min:a.min, cant:V.adic[id]}; }),
    disenio:Object.keys(V.adic).length ? V.disenio.trim() : '',
    // nivel de diseño y foto de referencia: solo si algún servicio admite diseño
    nivel: necesitaDisenio() && nivelDisenio(V.nivel) ? Object.assign({}, nivelDisenio(V.nivel), {suma:t.minNivel}) : null,
    refDisenio: necesitaDisenio() ? V.refDisenio : null,
    total:t.precio,
    deposito:t.deposito,
    cliente:{ nombre:V.cliente.nombre.trim(), tel:p.d+' '+V.cliente.tel.replace(/\D/g,''), email:V.cliente.email.trim() },
    estado: conDep ? 'apartada' : 'pendiente',
    origen:'link',
    creada:Date.now(),
    apartadoHasta: conDep ? finApartado(V.fecha, V.hora) : 0,
    comprobante:null,
    captura:null
  };
  if(!conDep) c.enviado = Date.now();
  c.historial = [{a:'Reservada por la clienta, por el link', q:null, t:Date.now()}];
  S.citas.push(c);
  V.citaId = c.id;
  V.comprobante = ''; V.captura = null; V.errores = {};
  guardar();
  V.paso = conDep ? 6 : 7; window.scrollTo(0,0); pintar();
}

function soltarApartado(silencio){
  const i = S.citas.findIndex(c=>c.id===V.citaId);
  if(i >= 0 && (S.citas[i].estado === 'apartada' || S.citas[i].estado === 'expirada')) S.citas.splice(i,1);
  V.citaId = null; guardar();
  if(!silencio){ aviso('Espacio liberado'); irPaso(4); }
}
/* Lee una imagen, la achica y la guarda en V[campo]: 'captura' (comprobante) o 'refDisenio' */
function tomarCaptura(inp, campo){
  campo = campo || 'captura';
  const f = inp.files && inp.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, e = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*e); cv.height = Math.round(img.height*e);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      V[campo] = cv.toDataURL('image/jpeg',.7);
      pintar();
    };
    img.onerror = () => aviso('No se pudo leer la imagen');
    img.src = r.result;
  };
  r.readAsDataURL(f);
}

function enviarComprobante(){
  const c = S.citas.find(x=>x.id===V.citaId);
  if(!c) return;
  if(c.estado === 'expirada'){ pintar(); return; }
  if(!V.comprobante.trim() && !V.captura){
    V.errores = {comp:'Escribí el número del comprobante o adjuntá la captura.'};
    pintar(); return;
  }
  c.comprobante = V.comprobante.trim() || null;
  c.captura = V.captura;
  c.estado = 'pendiente';
  c.enviado = Date.now();
  (c.historial = c.historial || []).push({a:'La clienta mandó el comprobante', q:null, t:Date.now()});
  V.errores = {};
  guardar();
  V.paso = 7; window.scrollTo(0,0); pintar();
}

function reiniciarFlujo(){
  V.sel = []; V.adic = {}; V.disenio = ''; V.nivel = null; V.refDisenio = null; V.notaServ = null;
  V.fecha = null; V.hora = null; V.horaProf = null; V.citaId = null;
  V.prof = null;
  V.cliente = {nombre:'',pais:'CR',tel:'',email:''};
  V.comprobante = ''; V.captura = null; V.errores = {}; V.paso = 1;
  V.pantalla = 'inicio';
  window.scrollTo(0,0); pintar();
}
function copiar(txt, msg){
  const ok = () => aviso(msg || 'Número copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, () => copiaVieja(txt, ok));
  } else copiaVieja(txt, ok);
}
function copiaVieja(txt, ok){
  const a = document.createElement('textarea');
  a.value = txt; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ aviso(txt); }
  document.body.removeChild(a);
}

function abrirWhatsApp(id){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  const l = [];
  l.push('Hola, reservé una cita con '+nombreProf(c.prof)+' por la agenda en línea de VAZÚ.');
  l.push('');
  l.push('Nombre: '+c.cliente.nombre);
  l.push('Día: '+fechaLarga(c.fecha));
  l.push('Hora: '+hora12(aMin(c.hora)));
  l.push('Con: '+nombreProf(c.prof));
  l.push('Servicios: '+c.servicios.map(nomServ).join(' + '));
  if(c.adicionales && c.adicionales.length) l.push('Extras: '+c.adicionales.map(a=>a.nombre+(a.precio==null?' (precio a consultar)':'')).join(', '));
  if(c.disenio) l.push('Diseño: '+c.disenio);
  l.push('Duración: '+dur(c.duracion));
  l.push('Total'+(tieneConsulta(c)?' de servicios':'')+': '+col(c.total));
  if(tieneConsulta(c)) l.push(NOTA_EXTRAS);
  if(c.deposito > 0){
    l.push('Depósito enviado: '+col(c.deposito));
    if(c.comprobante) l.push('Comprobante: '+c.comprobante);
    l.push('');
    l.push('Adjunto la captura del SINPE.');
  }
  window.open('https://wa.me/'+S.config.whatsapp+'?text='+encodeURIComponent(l.join('\n')), '_blank');
}

  (c.historial = c.historial || []).push({a:accion, q:quienSoy(), t:Date.now()});

  S.registro = S.registro || [];

  if(S.registro.length > 200) S.registro.length = 200;

    '<div>'+esc(x.a)+(x.q?' por '+esc(x.q):'')+' · '+cuandoTxt(x.t)+'</div>').join('')+'</div>';

  for(const c of lista){
    h += '<div class="pend-fila" style="--c:'+esc(colorProf(c.prof))+'">'+
      '<button class="pend-info" onclick="modalCita(\''+c.id+'\')">'+
        '<b>'+esc(c.cliente.nombre)+'</b>'+
        '<span>'+capital(fechaCorta(c.fecha))+', '+hora12(aMin(c.hora))+', con '+esc(nombreProf(c.prof))+'</span>'+
        '<span class="nota">'+esc(c.servicios.map(nomServ).join(' + '))+'</span></button>'+
      '<div class="pend-acc">'+

/* Después de una acción dentro de la ventana de la cita, la ventana se actualiza (o se cierra si la cita ya no existe) */
function refrescarCita(id){ if(S.citas.some(x => x.id === id)) modalCita(id); else cerrarModal(); }

/* Los botones de una cita, iguales en la agenda y en la ventana de la cita */
function accionesCita(c, enVentana){
  const id = c.id, luego = enVentana ? ';refrescarCita(\''+id+'\')' : '';
  const activa = !['rechazada','cancelada','expirada'].includes(c.estado);
  let h = botonWA(c);
  if(activa && c.estado !== 'completada') h += '<button class="mini" onclick="modalMover(\''+id+'\')">Mover</button>';
  if(c.estado === 'pendiente') h += '<button class="mini" onclick="modalDuracion(\''+id+'\')">Ajustar duración</button>';
  if(c.estado === 'pendiente') h += '<button class="mini g" onclick="aprobar(\''+id+'\')'+luego+'">Aprobar</button>';
  if(c.estado === 'aprobada') h += '<button class="mini g" onclick="completar(\''+id+'\')'+luego+'">Marcar completada</button>';
  if(activa) h += '<button class="mini r" onclick="cancelar(\''+id+'\')'+luego+'">Cancelar</button>';
  h += '<button class="mini r" onclick="eliminarCita(\''+id+'\')'+luego+'">Eliminar</button>';
  return h;

/* Selector de arriba: Todas · Valeria · Melissa */
const deVista = c => V.admin.prof === 'todas' || c.prof === V.admin.prof;
function filtroPro(){
  if(S.profesionales.length < 2) return '';
  let h = '<div class="filtro-pro"><button class="chip '+(V.admin.prof==='todas'?'on':'')+'" onclick="verPro(\'todas\')">Todas</button>';
  for(const p of S.profesionales){
    if(!p.activo && !S.citas.some(c=>c.prof===p.id)) continue;

      '<span class="bolita" style="--c:'+esc(p.color)+'"></span>'+esc(p.nombre)+(p.activo?'':' (inactiva)')+'</button>';
  }
  return h+'</div>';

function verPro(id){ V.admin.prof = id; pintar(); }
function cuenta(hasta){
  let s = Math.max(0, Math.floor((hasta - Date.now())/1000));
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return (h>0? h+':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function encCita(c, extra){
  return '<div class="cita-enc"><div class="h">'+hora12(aMin(c.hora)).replace(' ','<span style="font-size:10.5px;letter-spacing:.06em"> ')+'</span></div>'+
    '<div style="flex:1;min-width:0"><div class="nm">'+esc(c.cliente.nombre)+'</div>'+
    '<div class="sub"><span class="pro-tag" style="--c:'+esc(colorProf(c.prof))+'">'+esc(nombreProf(c.prof))+'</span> · '+
      fechaCorta(c.fecha)+' · '+dur(c.duracion)+' · '+(c.origen==='manual'?'a mano':'por el link')+'</div></div>'+
    '<div class="lado"><span class="est '+c.estado+'">'+etiqueta(c.estado)+'</span>'+

/* Tarjeta de cita con el color de su profesional */
const abreCita = (c, cls) => '<div class="cita de-pro '+(cls||'')+'" style="--c:'+esc(colorProf(c.prof))+'">';

/* Arma el enlace de WhatsApp hacia la clienta.
   Los teléfonos están guardados como "+506 8812 4497": hay que dejar
   solo los dígitos. Devuelve null si la cita no tiene teléfono. */
function telWA(c){
  let n = soloDigitos(c.cliente && c.cliente.tel);
  if(!n) return null;
  if(n.length === 8) n = '506' + n;                 // número tico sin código de país
  return n;
}
function waCliente(c, llaveFija){
  const n = telWA(c);
  if(!n) return null;
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(textoWA(c, llaveFija));
}
/* El texto del mensaje, con los datos de la cita. llaveFija elige la plantilla (por ejemplo 'movida'). */
function textoWA(c, llaveFija){
  const resta = c.total - (['pendiente','aprobada','completada'].includes(c.estado) ? c.deposito : 0);
  const datos = {
    nombre:(c.cliente.nombre||'').split(' ')[0] || c.cliente.nombre,
    profesional:nombreProf(c.prof),
    dia:fechaLarga(c.fecha).toLowerCase(),
    hora:hora12(aMin(c.hora)),
    servicios:c.servicios.map(nomServ).join(' + ').toLowerCase(),
    duracion:dur(c.duracion),
    total:col(c.total),
    deposito:col(c.deposito),
    resta:col(resta),
    sinpe:S.config.sinpe,
    extras:tieneConsulta(c) ? ' El precio de los extras se confirma con tu manicurista.' : '',
    antes:c.aviso ? fechaLarga(c.aviso.fecha).toLowerCase()+' a las '+hora12(aMin(c.aviso.hora)) : ''
  };
  // sin depósito se usan las plantillas que no lo mencionan
  const llave = llaveFija || ((!c.deposito && MENSAJES_WA[c.estado+'Sin']) ? c.estado+'Sin' : c.estado);
  const plantilla = MENSAJES_WA[llave] || MENSAJES_WA.otro;
  return plantilla
    .replace(/\{(\w+)\}/g, (m,k) => datos[k] !== undefined ? datos[k] : m)
    .replace(/\.\.(?!\.)/g, '.')         // "a las 11:30 a.m.." -> "a las 11:30 a.m."
    .replace(/las 1:(\d\d)/g, 'la 1:$1'); // "a las 1:00 p.m." -> "a la 1:00 p.m."
}
function botonWA(c){
  const url = waCliente(c);
  if(!url) return '';                               // sin teléfono, sin botón
  return '<a class="mini w" href="'+url+'" target="_blank" rel="noopener">'+ICO.wa+'WhatsApp</a>';
}

function etiqueta(e){
  return {apartada:'Apartada', pendiente:'Por confirmar', aprobada:'Confirmada', completada:'Completada',
          rechazada:'Rechazada', cancelada:'Cancelada', expirada:'Expirada'}[e] || e;
}
function detalleCita(c){

  }
  for(const s of c.servicios) h += '<div class="lin"><span>'+esc(nomServ(s))+'</span><span class="v">'+col(s.precio)+'</span></div>';

  if(c.disenio) h += '<div class="nota" style="margin:2px 0 6px">Diseño que pidió: '+esc(c.disenio)+'</div>';

  h += '<div class="lin tot"><span>Total'+(tieneConsulta(c)?' de servicios':'')+'</span><span class="v">'+col(c.total)+'</span></div>';
  // lo que se cobró por los extras se anota a mano, para que entre en ingresos
  if(tieneConsulta(c) && ['aprobada','completada'].includes(c.estado)){
    h += '<div class="lin sub" style="align-items:center"><span>Cobrado por extras</span><span class="v">'+
      '<input class="inp" type="number" step="500" min="0" style="width:96px;padding:6px 8px;font-size:13px;text-align:right" '+
      'value="'+(c.extrasCobrado||'')+'" placeholder="₡" onchange="setExtraCobrado(\''+c.id+'\',this.value)"></span></div>';
  }
  if(c.deposito > 0){
    const dep = ['pendiente','aprobada','completada'].includes(c.estado) ? c.deposito : 0;
    const etDep = dep ? 'Depósito recibido' : (c.estado === 'apartada' ? 'Depósito por llegar' : 'Sin depósito');
    h += '<div class="lin sub"><span>'+etDep+'</span><span class="v">'+col(dep)+'</span></div>';
    h += '<div class="lin sub"><span>Por cobrar en el estudio</span><span class="v">'+col(c.total-dep)+'</span></div>';
  }else{
    // sin depósito no se muestra una fila en ₡0: solo cuando el depósito está encendido
    if(S.config.pideDeposito) h += '<div class="lin sub"><span>'+(c.origen==='manual'?'Cita a mano, sin depósito':'Sin depósito')+'</span><span class="v">'+col(0)+'</span></div>';
  }
  h += '<div class="sep"></div><div class="nota">'+esc(c.cliente.tel||'sin teléfono')+
       (c.cliente.email?' · '+esc(c.cliente.email):'')+'</div>';
  h += histHTML(c);
  return h+'</div>';

/* ------------------------------------------------------------
   Ajustar duración antes de aprobar: el nivel de diseño es una
   estimación de la clienta; la manicurista ve la foto y corrige.
   No puede chocar con la cita siguiente ni pasarse del horario.
   ------------------------------------------------------------ */
function modalDuracion(id){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  V._dur = {id, min:c.duracion, err:'', otra:null};
  pintarDuracion();
}
function pintarDuracion(){
  const z = V._dur, c = S.citas.find(x=>x.id===z.id);
  const ini = aMin(c.hora);
  let ops = '';
  for(let m = 15; m <= 360; m += 15) ops += '<option value="'+m+'"'+(m===z.min?' selected':'')+'>'+dur(m)+'</option>';
  let h = '<div class="modal-enc"><div><h3>Ajustar duración</h3>'+
    '<div class="nota">'+esc(c.cliente.nombre)+' con '+esc(nombreProf(c.prof))+', '+fechaCorta(c.fecha).toLowerCase()+'. '+
    'Ahora dura '+dur(c.duracion)+': de '+hora12(ini)+' a '+hora12(ini + c.duracion)+'.</div></div>'+
    '<button class="x" onclick="cerrarModal()">×</button></div>';
  if(c.nivel) h += '<div class="nota-caja" style="margin-bottom:12px">Eligió <b style="font-weight:400">'+esc(c.nivel.n.toLowerCase())+'</b>'+
    (c.refDisenio ? ' y mandó una foto de referencia.' : '.')+'</div>';
  if(c.refDisenio) h += '<img src="'+c.refDisenio+'" alt="Foto de referencia del diseño" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:12px">';
  h += '<div class="campo"><label>Nueva duración</label><select class="inp" onchange="V._dur.min=+this.value;V._dur.err=\'\';V._dur.otra=null;pintarDuracion()">'+ops+'</select>'+
    '<div class="nota" style="margin-top:6px">Terminaría a '+alaHora(aHora(ini + z.min))+'.</div></div>';
  if(z.err){
    h += '<div class="nota-caja" style="margin-bottom:12px;background:rgba(149,91,60,.1);border-color:rgba(149,91,60,.3)">'+esc(z.err)+'</div>';
    h += '<div class="chips" style="margin-bottom:12px">'+
      '<button class="mini" onclick="modalMover(\''+c.id+'\','+z.min+')">Mover esta cita con '+dur(z.min)+'</button>'+
      (z.otra ? '<button class="mini" onclick="modalMover(\''+z.otra+'\')">Mover la otra cita</button>' : '')+'</div>';
  }
  h += '<button class="btn" '+(z.min===c.duracion?'disabled':'')+' onclick="confirmarDuracion()">Guardar duración</button>';
  modal(h);
}
function confirmarDuracion(){
  sincronizar();
  const z = V._dur, c = S.citas.find(x=>x.id===z.id); if(!c) return;
  const p = prof(c.prof), ini = aMin(c.hora), fin = ini + z.min;
  // la primera cita de esa profesional que se pisaría con la nueva duración
  const otra = S.citas.filter(x => x.prof===c.prof && x.fecha===c.fecha && x.id!==c.id && bloquea(x) &&
                                   ini < aMin(x.hora)+x.duracion && fin > aMin(x.hora))
                      .sort((a,b) => aMin(a.hora)-aMin(b.hora))[0];
  if(otra){
    z.otra = otra.id;
    z.err = 'Con '+dur(z.min)+' terminaría a '+alaHora(aHora(fin))+' y choca con la cita de '+otra.cliente.nombre+
      ', que empieza a '+alaHora(otra.hora)+' Mové una de las dos o elegí una duración más corta.';
    pintarDuracion(); return;
  }
  const bloque = horarioDe(p, c.fecha).find(b => aMin(b.ini) <= ini && ini < aMin(b.fin));
  if(!bloque || fin > aMin(bloque.fin)){
    z.otra = null;
    z.err = 'Con '+dur(z.min)+' se pasa del horario de '+p.nombre+(bloque ? ', que ese rato termina a '+alaHora(bloque.fin)+'' : '.')+
      ' Mové la cita o elegí una duración más corta.';
    pintarDuracion(); return;
  }
  const antes = c.duracion;
  c.duracion = z.min;
  registrar(c, 'Ajustó la duración de '+dur(antes)+' a '+dur(z.min));
  guardar(); cerrarModal(); aviso('Duración guardada'); pintar();
}
function aprobar(id){ const c=S.citas.find(x=>x.id===id); if(!c) return; c.estado='aprobada'; registrar(c,'Aprobada'); guardar(); aviso('Cita confirmada'); pintar(); }
function rechazar(id){
  const c=S.citas.find(x=>x.id===id); if(!c) return;
  c.estado='rechazada'; registrar(c,'Rechazada'); guardar(); aviso('Rechazada, el espacio quedó libre'); pintar();
}
function liberar(id){
  const c=S.citas.find(x=>x.id===id); if(!c) return;
  c.estado='expirada'; registrar(c,'Apartado liberado'); guardar(); aviso('Espacio liberado'); pintar();

/* Menú de fecha: atajos y un calendario chico con puntos donde hay citas */
function modalFecha(ym){
  const actual = V.admin.fecha || hoyCR(), hoy = hoyCR();
  const [y, m] = (ym || actual.slice(0,7)).split('-').map(Number);
  const mesStr = (yy, mm) => { const d = new Date(Date.UTC(yy, mm-1, 1)); return d.toISOString().slice(0,7); };
  const ant = mesStr(y, m-1), sig = mesStr(y, m+1);
  const atajos = [['Hoy', hoy], ['Mañana', sumarDias(hoy,1)], ['En una semana', sumarDias(hoy,7)]];
  let h = '<div class="modal-enc"><div><h3>Ir a una fecha</h3><div class="nota">Viendo: '+capital(fechaLarga(actual))+'</div></div>'+
    '<button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>';
  h += '<div class="fecha-atajos">'+atajos.map(([t,f]) =>
    '<button class="chip'+(f===actual?' on':'')+'" onclick="irFecha(\''+f+'\')">'+t+'</button>').join('')+'</div>';
  h += '<div class="cal-enc" style="margin:14px 0 6px">'+
    '<button class="flecha" onclick="modalFecha(\''+ant+'\')" aria-label="Mes anterior">'+ICO.flechaI+'</button>'+
    '<h3 style="font-size:16px">'+capital(MESES[m-1])+' '+y+'</h3>'+
    '<button class="flecha" onclick="modalFecha(\''+sig+'\')" aria-label="Mes siguiente">'+ICO.flechaD+'</button></div>';
  const primero = new Date(Date.UTC(y, m-1, 1)), dias = new Date(Date.UTC(y, m, 0)).getUTCDate(), desfase = (primero.getUTCDay()+6)%7;
  h += '<div class="fcal">';
  for(const d of ['L','M','M','J','V','S','D']) h += '<span class="fcal-dow">'+d+'</span>';
  for(let i=0;i<desfase;i++) h += '<span></span>';
  for(let n=1;n<=dias;n++){
    const f = y+'-'+String(m).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const hay = citasDelDia(f).length;
    h += '<button class="fcal-dia'+(f===actual?' sel':'')+(f===hoy?' hoy':'')+'" onclick="irFecha(\''+f+'\')" '+
      'aria-label="'+capital(fechaLarga(f))+(hay ? ', '+hay+' cita'+(hay>1?'s':'') : '')+'">'+n+(hay ? '<i></i>' : '')+'</button>';
  }
  modal(h+'</div>');
}
function abrirDia(f){ V.admin.fecha = f; V.admin.vista = 'dia'; window.scrollTo(0,0); pintar(); }
function moverPeriodo(n){
  const v = V.admin.vista || 'dia', f = V.admin.fecha || hoyCR();
  if(v === 'semana') V.admin.fecha = sumarDias(f, 7*n);
  else if(v === 'mes'){ const d = deYMD(f); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n); V.admin.fecha = d.toISOString().slice(0,10); }
  else V.admin.fecha = sumarDias(f, n);
  pintar();
}
/* Lo que se ve en semana y mes: citas activas del día, según el filtro de profesional */
const citasDelDia = f => S.citas.filter(c => c.fecha===f && !['rechazada','cancelada','expirada'].includes(c.estado) && deVista(c))
                                .sort((a,b) => aMin(a.hora)-aMin(b.hora));
const profsVista = () => V.admin.prof === 'todas' ? profsActivas() : [prof(V.admin.prof)].filter(Boolean);
const atiendeEse = f => profsVista().some(p => bloquesDelDia(p, f).length);
const encPeriodo = titulo => '<div class="cal-enc">'+
  '<button class="flecha" onclick="moverPeriodo(-1)" aria-label="Anterior">'+ICO.flechaI+'</button>'+
  '<h3 style="text-align:center;font-size:17px">'+titulo+'</h3>'+
  '<button class="flecha" onclick="moverPeriodo(1)" aria-label="Siguiente">'+ICO.flechaD+'</button></div>';

/* Semana: siete días en fila (en celular, uno debajo del otro). Tocar un día abre su vista. */
function agendaSemana(f){
  const ini = inicioSemana(f), fin = sumarDias(ini, 6), dIni = deYMD(ini), dFin = deYMD(fin);
  const titulo = dIni.getUTCMonth() === dFin.getUTCMonth()
    ? dIni.getUTCDate()+' al '+dFin.getUTCDate()+' de '+MESES[dFin.getUTCMonth()]
    : dIni.getUTCDate()+' de '+MESES[dIni.getUTCMonth()]+' al '+dFin.getUTCDate()+' de '+MESES[dFin.getUTCMonth()];
  let h = encPeriodo(capital(titulo));
  const todas = V.admin.prof === 'todas';
  h += '<div class="semana">';
  for(let i=0;i<7;i++){
    const d = sumarDias(ini, i), citas = citasDelDia(d), abre = atiendeEse(d), dd = deYMD(d);
    h += '<div class="sem-dia'+(d===hoyCR()?' hoy':'')+(abre?'':' cerrado')+'">'+
      '<button class="sem-cab" onclick="modalDia(\''+d+'\')" aria-label="Ver el '+fechaLarga(d).toLowerCase()+'">'+
        '<span class="sem-dow">'+DIAS_C[dd.getUTCDay()]+'</span><span class="sem-n">'+dd.getUTCDate()+'</span>'+
        '<span class="sem-cuenta">'+(citas.length ? citas.length+' cita'+(citas.length>1?'s':'') : (abre ? 'Libre' : 'No atienden'))+'</span>'+
      '</button>';
    for(const c of citas){
      const pend = c.estado === 'pendiente' || c.estado === 'apartada';
      h += '<button class="sem-cita'+(pend?' pend':'')+'" style="--c:'+esc(colorProf(c.prof))+'" onclick="modalCita(\''+c.id+'\')">'+
        '<span class="sem-h">'+hora12(aMin(c.hora))+'</span>'+
        '<span class="sem-nm">'+esc((c.cliente.nombre||'').split(' ').slice(0,2).join(' '))+'</span>'+
        (todas ? '<span class="sem-pro">'+esc(nombreProf(c.prof))+'</span>' : '')+
        (pend ? '<span class="sem-est">'+etiqueta(c.estado).toLowerCase()+'</span>' : '')+
      '</button>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* Mes: la cuadrícula del mes con un punto por cita, del color de su profesional */
function agendaMes(f){
  const d0 = deYMD(f), y = d0.getUTCFullYear(), m = d0.getUTCMonth();
  const primero = new Date(Date.UTC(y,m,1)), dias = new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const desfase = (primero.getUTCDay()+6)%7;
  let h = encPeriodo(capital(MESES[m])+' '+y);
  h += '<div class="mes">';
  for(const d of ['L','M','M','J','V','S','D']) h += '<div class="mes-dow">'+d+'</div>';
  for(let i=0;i<desfase;i++) h += '<div></div>';
  for(let n=1;n<=dias;n++){
    const fe = y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const citas = citasDelDia(fe), abre = atiendeEse(fe);
    const pend = citas.filter(c => c.estado==='pendiente' || c.estado==='apartada').length;
    h += '<button class="mes-dia'+(fe===hoyCR()?' hoy':'')+(abre?'':' cerrado')+'" onclick="modalDia(\''+fe+'\')" '+
      'aria-label="'+capital(fechaLarga(fe))+': '+(citas.length ? citas.length+' citas' : (abre?'libre':'no atienden'))+'">'+
      '<span class="mes-n">'+n+'</span>'+
      '<span class="mes-pts">'+citas.slice(0,6).map(c=>'<i style="background:'+esc(colorProf(c.prof))+'"></i>').join('')+(citas.length>6?'<b>+'+(citas.length-6)+'</b>':'')+'</span>'+
      (citas.length ? '<span class="mes-cuenta">'+citas.length+' cita'+(citas.length>1?'s':'')+(pend?', '+pend+' por confirmar':'')+'</span>' : '')+
    '</button>';
  }
  h += '</div>';
  if(V.admin.prof === 'todas' && profsActivas().length > 1){
    h += '<div class="mes-ley">'+profsActivas().map(p=>'<span><span class="bolita" style="--c:'+esc(p.color)+'"></span>'+esc(p.nombre)+'</span>').join('')+'</div>';
  }
  return h;
}

/* Día: una columna por profesional (con "Todas"), con citas y pausas */
function agendaDia(f){
  const delDia = S.citas.filter(c=>c.fecha===f && !['rechazada','cancelada','expirada'].includes(c.estado))
                        .sort((a,b)=>aMin(a.hora)-aMin(b.hora));
  const lista = V.admin.prof === 'todas'
    ? S.profesionales.filter(p => p.activo || delDia.some(c=>c.prof===p.id))
    : [prof(V.admin.prof)].filter(Boolean);

  let h = '<div class="cal-enc">'+
    '<button class="flecha" onclick="moverDiaAdmin(-1)" aria-label="Día anterior">'+ICO.flechaI+'</button>'+
    '<h3 style="text-align:center;font-size:17px">'+capital(fechaLarga(f))+(f===hoyCR()?', hoy':'')+'</h3>'+
    '<button class="flecha" onclick="moverDiaAdmin(1)" aria-label="Día siguiente">'+ICO.flechaD+'</button></div>';
  h += '<div style="height:6px"></div>';

  h += '<div class="cols'+(lista.length>1?' en-par':'')+'">';
  for(const p of lista){
    const dia = delDia.filter(c=>c.prof===p.id);
    const ocupado = dia.filter(c=>bloquea(c)).reduce((s,c)=>s+c.duracion,0);
    const bloques = bloquesDelDia(p, f);
    const cerrado = !bloques.length;
    const especial = tieneExcepcion(p, f);
    h += '<div class="col" style="--c:'+esc(p.color)+'"><div class="col-enc"><span class="bolita"></span><span class="nm">'+esc(p.nombre)+'</span>'+
      '<span class="nota">'+(especial?'<span class="tag" style="margin-bottom:3px;display:inline-block">horario especial</span><br>':'')+
      (cerrado ? 'No atiende este día'
        : bloques.map(b=>hora12(aMin(b.ini))+' a '+hora12(aMin(b.fin))).join(' · ')+'<br>'+(ocupado ? dur(ocupado)+' ocupados' : 'Agenda libre'))+'</span></div>';
    if(!cerrado) h += '<button class="mini" style="margin:-2px 0 12px" onclick="modalPausa({prof:\''+p.id+'\',fecha:\''+f+'\'})">'+ICO.reloj.replace('<svg','<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"')+'Bloquear este rato</button>';

    /* línea del día: citas y pausas, por hora. Sin pausas configuradas no aparece ninguna. */
    const items = dia.map(c => ({t:aMin(c.hora), c}));
    for(const g of huecos(bloques)) items.push({t:aMin(g.ini), pausa:g, deSemana:!especial});
    pausasFecha(p, f).forEach((z,i) => items.push({t:aMin(z.ini), pausa:z, i}));
    items.sort((a,b) => a.t - b.t);
    if(!items.length) h += '<p class="vacio-mini">Sin citas este día.</p>';
    for(const it of items){
      if(it.pausa){
        const z = it.pausa;
        h += '<div class="pausa-ag"><span class="h">'+hora12(aMin(z.ini))+'</span><span style="flex:1">'+
          (it.i != null ? 'Rato bloqueado' : 'Pausa')+' hasta '+alaHora(z.fin)+
          '<span class="nota" style="display:block;font-size:11px">'+(it.i != null ? 'solo este día' : it.deSemana ? 'de su semana normal' : 'del horario especial de este día')+'</span></span>'+
          (it.i != null ? '<button class="txt-btn" onclick="quitarPausaFecha(\''+p.id+'\',\''+f+'\','+it.i+')">quitar</button>' : '')+'</div>';
        continue;
      }
      const c = it.c;
      h += abreCita(c)+encCita(c)+detalleCita(c)+'<div class="acc">'+accionesCita(c, false)+'</div></div>';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function moverDiaAdmin(n){ V.admin.fecha = sumarDias(V.admin.fecha||hoyCR(), n); pintar(); }
function completar(id){
  const c=S.citas.find(x=>x.id===id); if(!c) return;
  c.estado='completada'; c.completada=Date.now(); registrar(c,'Marcada completada'); guardar(); aviso('Sumada a ingresos'); pintar();
}
/* Cancelar: la cita queda en el historial pero libera el espacio y deja de contar en Ingresos */
function cancelar(id){
  const c=S.citas.find(x=>x.id===id); if(!c) return;
  const eraCompletada = c.estado === 'completada';
  if(!confirm('¿Cancelar la cita de '+c.cliente.nombre+'?\n'+
    (eraCompletada ? 'Ya estaba completada: deja de contar en Ingresos.' : 'El espacio queda libre en la agenda.'))) return;
  c.estado='cancelada'; registrar(c, eraCompletada ? 'Cancelada (estaba completada, sale de Ingresos)' : 'Cancelada');
  guardar(); aviso('Cita cancelada'); pintar();
}
/* Eliminar: se borra del todo (agenda e ingresos). Queda anotado en "Últimos cambios". */
function eliminarCita(id){
  const c=S.citas.find(x=>x.id===id); if(!c) return;
  if(!confirm('¿Eliminar la cita de '+c.cliente.nombre+' del '+fechaLarga(c.fecha).toLowerCase()+'?\n'+
    'Se borra de la agenda y de los ingresos. No se puede deshacer.')) return;
  S.citas = S.citas.filter(x => x.id !== id);
  anotar('Eliminó la cita de '+c.cliente.nombre+' ('+fechaCorta(c.fecha).toLowerCase()+', '+hora12(aMin(c.hora))+', con '+nombreProf(c.prof)+')');
  guardar(); aviso('Cita eliminada'); pintar();
}

/* Chips para elegir profesional dentro de un modal */
function chipsPro(actual, accion, aptas){

    h += '<button class="chip '+(actual===p.id?'on':'')+'" style="display:inline-flex;align-items:center;gap:7px" onclick="'+accion+'(\''+p.id+'\')">'+

/* --- Mover cita (de día, de hora, o a la otra profesional) --- */
/* dur (opcional): mover la cita ya con una duración nueva (viene de "Ajustar duración") */
function modalMover(id, dur){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  V._mover = { id:id, fecha:c.fecha, hora:null, prof:c.prof, dur:dur || null };
  pintarMover();
}
function moverPro(p){ V._mover.prof = p; V._mover.hora = null; pintarMover(); }
function pintarMover(){
  const m = V._mover, c = S.citas.find(x=>x.id===m.id);
  const duracion = m.dur || c.duracion;
  let libres = espacios(m.fecha, duracion, {excluir:c.id, admin:true, prof:m.prof});
  // una cita apartada necesita que el apartado siga durando algo después de moverla
  if(c.estado === 'apartada')
    libres = libres.filter(x => minutosHasta(m.fecha, x) - COLCHON_CITA >= APARTADO_MIN);
  const aptas = profsActivas().filter(p => c.servicios.every(s => { const x = servicio(s.id); return !x || hace(p, x); }));

  let h = '<div class="modal-enc"><div><h3>Mover cita</h3>'+
    '<div class="nota">'+esc(c.cliente.nombre)+' · '+(m.dur && m.dur !== c.duracion ? 'con la duración nueva: ' : '')+dur(duracion)+
    ' · queda como <b style="font-weight:400">'+etiqueta(c.estado).toLowerCase()+'</b></div></div>'+
    '<button class="x" onclick="cerrarModal()">×</button></div>';
  if(aptas.length > 1) h += '<div class="campo"><label>Con quién</label>'+chipsPro(m.prof, 'moverPro', aptas)+'</div>';
  h += '<div class="campo"><label>Día</label><input class="inp" type="date" value="'+m.fecha+'" min="'+hoyCR()+'" onchange="V._mover.fecha=this.value;V._mover.hora=null;pintarMover()"></div>';
  h += '<div class="campo"><label>Hora disponible de '+esc(nombreProf(m.prof))+'</label>';
  if(!libres.length) h += '<div class="nota-caja">Ese día '+esc(nombreProf(m.prof))+' no tiene un espacio de '+dur(duracion)+' libre'+
    (c.estado==='apartada'?' con margen suficiente para el apartado.':'.')+'</div>';
  else{
    h += '<div class="horas">';
    for(const x of libres) h += '<button class="hora '+(m.hora===x?'sel':'')+'" onclick="V._mover.hora='+x+';pintarMover()">'+hora12(x)+'</button>';
    h += '</div>';
  }
  h += '</div>';
  if(c.estado === 'apartada' && m.hora != null){
    h += '<div class="nota-caja">Al mover, el apartado pasa a vencer en <b style="font-weight:400;color:var(--alerta)">'+
      cuenta(finApartado(m.fecha, m.hora))+'</b>.</div>';
  }
  if(m.err) h += '<div class="err">'+m.err+'</div>';
  h += '<div style="height:10px"></div>';
  h += '<button class="btn" '+(m.hora==null?'disabled':'')+' onclick="confirmarMover()">Mover</button>';
  modal(h);
}
function confirmarMover(){
  sincronizar();
  const m = V._mover, c = S.citas.find(x=>x.id===m.id);
  if(!c || m.hora==null) return;
  // se revalida justo antes de guardar, por si algo cambió mientras el modal estaba abierto
  const duracion = m.dur || c.duracion;
  if(chocaCon(m.prof, m.fecha, m.hora, duracion, c.id)){
    m.err = nombreProf(m.prof)+' ya tiene una cita en ese espacio. Elegí otra hora.';
    m.hora = null; pintarMover(); return;
  }
  const antes = fechaCorta(c.fecha)+' '+hora12(aMin(c.hora))+' con '+nombreProf(c.prof);
  const durAntes = c.duracion;
  // para avisarle a la clienta: se guarda dónde estaba la cita. Si ya había un aviso sin mandar,
  // se conserva el horario original, que es el que ella conoce.
  if(!c.aviso || c.aviso.enviado) c.aviso = {fecha:c.fecha, hora:c.hora, prof:c.prof, enviado:false};
  c.fecha = m.fecha; c.hora = aHora(m.hora); c.prof = m.prof; c.duracion = duracion;
  registrar(c, 'Movida de '+antes+' a '+fechaCorta(c.fecha)+' '+hora12(m.hora)+' con '+nombreProf(c.prof)+
    (duracion !== durAntes ? ', con la duración ajustada de '+dur(durAntes)+' a '+dur(duracion) : ''));
  // la cita conserva su estado; si estaba apartada, el reloj se recalcula
  if(c.estado === 'apartada') c.apartadoHasta = finApartado(c.fecha, m.hora);
  guardar(); V.admin.fecha = c.fecha; pintar();
  modalAvisoCambio(c.id, true);                      // enseguida: el mensaje para avisarle
}

/* ------------------------------------------------------------
   Avisarle a la clienta que su cita cambió. El mensaje viene
   escrito (MENSAJES_WA.movida) y se puede retocar antes de mandarlo.
   ------------------------------------------------------------ */
function modalAvisoCambio(id, recien){
  const c = S.citas.find(x=>x.id===id); if(!c || !c.aviso) return;
  const a = c.aviso, nombre = (c.cliente.nombre||'').split(' ')[0] || 'la clienta';
  const fila = (et, f, h, p) => '<div class="cambio-fila"><span class="cambio-et">'+et+'</span>'+
    '<span>'+capital(fechaCorta(f))+', '+hora12(aMin(h))+'<br><span class="nota">con '+esc(nombreProf(p))+'</span></span></div>';
  let h = '<div class="modal-enc"><div><h3>'+(recien ? 'Cita movida' : 'Avisar del cambio')+'</h3>'+
    '<div class="nota">'+esc(c.cliente.nombre)+'</div></div>'+
    '<button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>';
  h += '<div class="cambio">'+fila('Antes', a.fecha, a.hora, a.prof)+fila('Ahora', c.fecha, c.hora, c.prof)+'</div>';
  h += '<div class="campo" style="margin-bottom:12px"><label for="msg-cambio">Mensaje para '+esc(nombre)+'</label>'+
    '<textarea class="inp msg-cambio" id="msg-cambio" rows="7">'+esc(textoWA(c, 'movida'))+'</textarea>'+
    '<div class="nota" style="margin-top:6px">Lo podés ajustar antes de mandarlo.</div></div>';
  const tel = telWA(c);
  if(tel){
    h += '<button class="btn wa" onclick="enviarAvisoCambio(\''+c.id+'\')">'+ICO.wa+'Enviar por WhatsApp</button>';
  }else{
    h += '<div class="nota-caja" style="margin-bottom:10px">Esta cita no tiene teléfono. Copiá el mensaje y mandalo por donde la contactés.</div>';
  }
  h += '<div class="acc-modal">'+
    '<button class="mini" onclick="copiarAvisoCambio(\''+c.id+'\')">Copiar mensaje</button>'+
    '<button class="mini r" onclick="cerrarModal()">Ahora no</button></div>';
  modal(h);
}
function enviarAvisoCambio(id){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  const texto = (document.getElementById('msg-cambio')||{}).value || textoWA(c, 'movida');
  window.open('https://wa.me/'+telWA(c)+'?text='+encodeURIComponent(texto), '_blank');
  c.aviso.enviado = true;
  registrar(c, 'Le avisó del cambio por WhatsApp');
  guardar(); cerrarModal(); aviso('Aviso listo en WhatsApp'); pintar();
}
function copiarAvisoCambio(id){
  const c = S.citas.find(x=>x.id===id); if(!c) return;
  copiar((document.getElementById('msg-cambio')||{}).value || textoWA(c, 'movida'), 'Mensaje copiado');
  c.aviso.enviado = true;                            // si lo copió, se asume que lo va a mandar por otro lado
  registrar(c, 'Copió el aviso del cambio');
  guardar(); pintar();
}

/* --- Cita manual (para las de siempre, que escriben directo) --- */
function modalManual(fecha){
  const p = partesCR();
  const pro = V.admin.prof !== 'todas' && prof(V.admin.prof) ? V.admin.prof : (profsActivas()[0]||{}).id;
  V._man = { prof:pro, serv:[S.servicios[0].id], extra:false, fecha:fecha || p.ymd, hora:null, nombre:'', tel:'', err:'' };
  pintarManual();
}
function manPro(id){
  const m = V._man; m.prof = id; m.hora = null;
  m.serv = m.serv.filter(sid => hace(prof(id), servicio(sid)));
  if(!m.serv.length){ const s = S.servicios.find(x => hace(prof(id), x)); if(s) m.serv = [s.id]; }
  pintarManual();
}
function calcManual(m){
  let minutos = 0, precio = 0;
  for(const id of m.serv){ const s=servicio(id); if(s){ minutos += s.min; precio += s.precio; } }
  if(m.extra) for(const a of S.adicionales){ minutos += a.min; if(a.precio != null) precio += a.precio; }
  return {minutos, precio};
}
function pintarManual(){
  const m = V._man;
  const {minutos, precio} = calcManual(m);
  const p = partesCR();
  const esHoy = m.fecha === p.ymd;
  const libres = espacios(m.fecha, minutos, {incluirPasadas:true, prof:m.prof});
  const ahoraMin = Math.floor(p.min/5)*5;
  const ahoraLibre = esHoy && !chocaCon(m.prof, m.fecha, ahoraMin, minutos);
  const pr = prof(m.prof);

  let h = '<div class="modal-enc"><div><h3>Cita manual</h3>'+
    '<div class="nota">Queda confirmada de una, sin pedir depósito.</div></div>'+
    '<button class="x" onclick="cerrarModal()">×</button></div>';

  if(profsActivas().length > 1) h += '<div class="campo"><label>Con quién</label>'+chipsPro(m.prof, 'manPro', profsActivas())+'</div>';

  h += '<div class="campo"><label>Servicio</label><div class="chips">';
  for(const s of S.servicios.filter(x => hace(pr, x))){
    const on = m.serv.includes(s.id);
    h += '<button class="chip '+(on?'on':'')+'" onclick="manServ(\''+s.id+'\')">'+esc(nomServ(s).replace('semipermanente','semiperm.'))+'</button>';
  }
  for(const a of S.adicionales){
    h += '<button class="chip '+(m.extra?'on':'')+'" onclick="V._man.extra=!V._man.extra;V._man.hora=null;pintarManual()">+ '+esc(a.nombre)+'</button>';
  }
  h += '</div><div class="nota" style="margin-top:7px">'+col(precio)+(m.extra?' + extras a consultar':'')+' · '+dur(minutos)+' · depósito no requerido</div></div>';

  h += '<div class="campo"><label>Nombre</label><input class="inp" id="man-nombre" value="'+esc(m.nombre)+'" oninput="V._man.nombre=this.value" autocomplete="name"></div>';
  h += '<div class="dos"><div class="campo" style="flex:1"><label>Día</label>'+
    '<input class="inp" type="date" value="'+m.fecha+'" onchange="V._man.fecha=this.value;V._man.hora=null;pintarManual()"></div>'+
    '<div class="campo" style="flex:1"><label>Teléfono <span style="text-transform:none;letter-spacing:0">(opcional)</span></label>'+
    '<input class="inp" inputmode="tel" value="'+esc(m.tel)+'" oninput="V._man.tel=this.value"></div></div>';

  h += '<div class="campo"><label>Hora'+(pr?' en la agenda de '+esc(pr.nombre):'')+'</label>';
  h += '<div class="horas">';
  if(ahoraLibre) h += '<button class="hora '+(m.hora==='ya'?'sel':'')+'" style="grid-column:span 3" onclick="V._man.hora=\'ya\';pintarManual()">Ahora mismo · '+hora12(ahoraMin)+'</button>';
  for(const x of libres) h += '<button class="hora '+(m.hora===x?'sel':'')+'" onclick="V._man.hora='+x+';pintarManual()">'+hora12(x)+'</button>';
  h += '</div>';
  if(!libres.length && !ahoraLibre) h += '<div class="nota-caja" style="margin-top:8px">'+esc(pr?pr.nombre:'')+' no tiene un espacio de '+dur(minutos)+' libre ese día. Podés mover otra cita, probar con otra profesional o cambiar su horario en Configuración.</div>';
  h += '</div>';
  if(m.err) h += '<div class="err">'+m.err+'</div>';
  h += '<div style="height:10px"></div><button class="btn" '+(m.hora==null?'disabled':'')+' onclick="guardarManual()">Guardar cita</button>';
  modal(h);
}
function manServ(id){
  const m = V._man;
  if(m.serv.length === 1 && m.serv[0] === id) return;   // siempre queda al menos un servicio
  const r = aplicarReglas(m.serv, id);                    // las mismas reglas del menú que en la reserva
  m.err = r.error || r.aviso || '';
  if(!r.error) m.serv = r.sel;
  m.hora = null; pintarManual();
}
function guardarManual(){
  sincronizar();
  const m = V._man;
  if(!m.nombre.trim()){ m.err='Escribí el nombre de la clienta.'; pintarManual(); return; }
  const p = partesCR();
  const inicio = m.hora==='ya' ? Math.floor(p.min/5)*5 : m.hora;
  const {minutos, precio} = calcManual(m);
  const servs = m.serv.map(id=>{ const s=servicio(id); return {id:s.id,cat:s.cat,nombre:s.nombre,precio:s.precio,min:s.min}; });
  const ads = m.extra ? S.adicionales.map(a=>({id:a.id,nombre:a.nombre,precio:a.precio,min:a.min,cant:1})) : [];
  if(chocaCon(m.prof, m.fecha, inicio, minutos)){
    m.err = nombreProf(m.prof)+' ya tiene una cita en ese espacio. Elegí otra hora o la otra profesional.';
    pintarManual(); return;
  }
  S.citas.push({
    id:nuevoId(), prof:m.prof, fecha:m.fecha, hora:aHora(inicio), duracion:minutos,
    servicios:servs, adicionales:ads, disenio:'', total:precio, deposito:0,
    cliente:{nombre:m.nombre.trim(), tel:m.tel.trim(), email:''},
    estado:'aprobada', origen:'manual', creada:Date.now(), apartadoHasta:0, comprobante:null, captura:null,
    historial:[{a:'Creada a mano', q:quienSoy(), t:Date.now()}]
  });
  guardar(); cerrarModal();
  anotar('Creó una cita a mano · '+m.nombre.trim()+' con '+nombreProf(m.prof)+', '+fechaCorta(m.fecha)+' '+hora12(inicio));
  guardar();
  V.admin.tab='agenda'; V.admin.fecha=m.fecha;
  aviso('Cita guardada'); pintar();
}

function cambiarRef(ref, fn, accion){
  const p = profCfg();
  let bl = bloquesRef(ref);
  const r = fn(bl);
  if(typeof r === 'string'){ aviso(r); pintar(); return false; }
  if(Array.isArray(r)) bl = r;
  const err = validarBloques(bl);
  if(err){ aviso(err); pintar(); return false; }
  asignarRef(ref, bl);
  anotar(accion+' · '+p.nombre+', '+nombreRef(ref));
  guardar(); aviso('Horario de '+p.nombre+' guardado'); avisarFuera(p); pintar();
  return true;
}
function setBloque(ref,k,q,v){ cambiarRef(ref, bl => { bl[k][q] = v; }, 'Cambió un bloque de horario'); }
function quitarBloqueRef(ref,k){ cambiarRef(ref, bl => { bl.splice(k,1); }, 'Quitó un bloque de horario'); }
function agregarBloqueRef(ref){
  cambiarRef(ref, bl => {
    const u = bl[bl.length-1];
    if(!u){ bl.push({ini:'09:00', fin:'18:00'}); return; }
    const a = aMin(u.fin) + 60, b = Math.min(a + 180, 22*60);
    if(a >= b) return 'No queda espacio ese día para otro bloque.';
    bl.push({ini:aHora(a), fin:aHora(b)});
  }, 'Agregó un bloque de horario');
}
function trabajaRef(ref, on){
  cambiarRef(ref, () => on ? [{ini:'09:00', fin:'18:00'}] : [], on ? 'Abrió el día' : 'Marcó que no trabaja');
}
function unirPausa(ref,k){ cambiarRef(ref, bl => { bl[k].fin = bl[k+1].fin; bl.splice(k+1,1); }, 'Quitó una pausa'); }

function agregarExcepcion(trabaja){

  p.excepciones[f] = trabaja ? (base.length ? base : [{ini:'09:00', fin:'18:00'}]) : [];

/* ------------------------------------------------------------
   Pausas. Dos tipos, una sola ventana:
   - {ref}          : pausa fija en la semana normal o en una excepción
                      (corta el bloque en dos)
   - {prof, fecha}  : rato bloqueado solo ese día ("Bloquear este rato")
   ------------------------------------------------------------ */
function modalPausa(o){
  const p = prof(o.prof || V.admin.cfgProf);
  const fecha = o.ref ? null : (o.fecha || hoyCR());
  const bl = o.ref ? bloquesRef(o.ref) : horarioDe(p, fecha);
  // propuesta inicial: el próximo cuarto de hora si es hoy, si no el medio del primer bloque
  let a = bl.length ? aMin(bl[0].ini) + Math.floor((aMin(bl[0].fin) - aMin(bl[0].ini)) / 2 / 15) * 15 : 12*60;
  if(fecha === hoyCR()) a = Math.max(aMin(bl.length ? bl[0].ini : '05:00'), Math.ceil(minCR()/15)*15);
  a = Math.min(a, 21*60);
  V._pz = {ref:o.ref || null, prof:p.id, fecha, conFecha: !o.ref && !o.fecha, ini:aHora(a), fin:aHora(Math.min(a+60, 22*60)), err:''};
  pintarPausa();
}
function pintarPausa(){
  const z = V._pz, p = prof(z.prof);
  const titulo = z.ref ? 'Agregar pausa' : 'Bloquear un rato';
  const sub = z.ref ? p.nombre+' · '+nombreRef(z.ref)+'. Se repite '+(z.ref.startsWith('b:')?'todas las semanas':'solo ese día')+'.'
                    : p.nombre+' · solo ese día. Su horario normal no cambia.';
  let h = '<div class="modal-enc"><div><h3>'+titulo+'</h3><div class="nota">'+esc(sub)+'</div></div>'+
    '<button class="x" onclick="cerrarModal()">×</button></div>';
  if(z.conFecha) h += '<div class="campo"><label>Día</label><input class="inp" type="date" min="'+hoyCR()+'" value="'+(z.fecha||'')+'" onchange="V._pz.fecha=this.value;V._pz.err=\'\';pintarPausa()"></div>';
  else if(!z.ref) h += '<div class="nota" style="margin-bottom:12px">'+capital(fechaLarga(z.fecha))+'</div>';
  h += '<div class="dos"><div class="campo" style="flex:1"><label>Desde</label>'+selHora(z.ini, "V._pz.ini=this.value")+'</div>'+
       '<div class="campo" style="flex:1"><label>Hasta</label>'+selHora(z.fin, "V._pz.fin=this.value")+'</div></div>';
  if(z.err) h += '<div class="err" style="margin-bottom:8px">'+esc(z.err)+'</div>';
  h += '<button class="btn" onclick="confirmarPausa()">'+(z.ref?'Agregar pausa':'Bloquear este rato')+'</button>';
  modal(h);
}
function confirmarPausa(){
  const z = V._pz, p = prof(z.prof);
  const a = aMin(z.ini), b = aMin(z.fin);
  if(a >= b){ z.err = 'La pausa tiene que terminar después de empezar.'; pintarPausa(); return; }
  const toca = bl => bl.some(x => a < aMin(x.fin) && b > aMin(x.ini));
  if(z.ref){
    if(!toca(bloquesRef(z.ref))){ z.err = 'Ese rato queda fuera de su horario: no hace falta pausa.'; pintarPausa(); return; }
    cerrarModal();
    cambiarRef(z.ref, bl => restar(bl, z.ini, z.fin), 'Agregó una pausa de '+hora12(a)+' a '+hora12(b));
    return;
  }
  sincronizar();
  const pp = prof(z.prof);
  if(!z.fecha){ z.err = 'Elegí el día.'; pintarPausa(); return; }
  if(!toca(horarioDe(pp, z.fecha))){ z.err = pp.nombre+' no trabaja en ese rato: no hace falta bloquearlo.'; pintarPausa(); return; }
  if(chocaCon(pp.id, z.fecha, a, b - a)){
    z.err = pp.nombre+' ya tiene una cita en ese rato. Movela primero o elegí otro rato.'; pintarPausa(); return;
  }
  pp.pausas = pp.pausas || {};
  (pp.pausas[z.fecha] = pp.pausas[z.fecha] || []).push({ini:z.ini, fin:z.fin});
  pp.pausas[z.fecha].sort((x,y) => aMin(x.ini) - aMin(y.ini));
  anotar('Bloqueó un rato · '+pp.nombre+', el '+fechaLarga(z.fecha).toLowerCase()+' de '+hora12(a)+' a '+hora12(b));
  guardar(); cerrarModal(); aviso('Rato bloqueado en la agenda de '+pp.nombre); pintar();
}
function quitarPausaFecha(profId, f, i){
  const p = prof(profId), z = p.pausas[f][i];
  p.pausas[f].splice(i,1);
  if(!p.pausas[f].length) delete p.pausas[f];
  anotar('Quitó un rato bloqueado · '+p.nombre+', el '+fechaLarga(f).toLowerCase()+' de '+hora12(aMin(z.ini))+' a '+hora12(aMin(z.fin)));

}

/* --- Ingresos: solo citas completadas --- */
function tabIngresos(){
  const hoy = hoyCR(), sem = inicioSemana(hoy), mes = hoy.slice(0,7);
  const hechas = S.citas.filter(c=>c.estado==='completada' && deVista(c));
  const sum = arr => arr.reduce((s,c)=>s+cobrado(c),0);
  const delDia = hechas.filter(c=>c.fecha===hoy);
  const delSem = hechas.filter(c=>c.fecha>=sem && c.fecha<=sumarDias(sem,6));
  const delMes = hechas.filter(c=>c.fecha.slice(0,7)===mes);
  const quien = V.admin.prof === 'todas' ? '' : ' · '+nombreProf(V.admin.prof);

  let h = '<div class="rot">Cobrado, solo citas completadas'+esc(quien)+'</div>';
  h += '<div class="kpis">'+
    '<div class="kpi"><div class="k">Hoy</div><div class="v">'+col(sum(delDia))+'</div><div class="s">'+delDia.length+' cita'+(delDia.length===1?'':'s')+'</div></div>'+
    '<div class="kpi"><div class="k">Semana</div><div class="v">'+col(sum(delSem))+'</div><div class="s">'+delSem.length+' cita'+(delSem.length===1?'':'s')+'</div></div>'+
    '<div class="kpi"><div class="k">Mes</div><div class="v">'+col(sum(delMes))+'</div><div class="s">'+delMes.length+' cita'+(delMes.length===1?'':'s')+'</div></div>'+
  '</div>';

  /* Por profesional (siempre se ven todas, para comparar) */
  const todasMes = S.citas.filter(c=>c.estado==='completada' && c.fecha.slice(0,7)===mes);
  const totMes = todasMes.reduce((s,c)=>s+cobrado(c),0);
  h += '<div class="rot">Desglose del mes por profesional</div><div class="card">';
  for(const p of S.profesionales){
    const suyas = todasMes.filter(c=>c.prof===p.id);
    if(!p.activo && !suyas.length) continue;
    const m = suyas.reduce((s,c)=>s+cobrado(c),0);
    const pct = totMes ? Math.round(m*100/totMes) : 0;
    const marcada = V.admin.prof === p.id;
    h += '<div style="padding:7px 0;'+(V.admin.prof!=='todas' && !marcada?'opacity:.55':'')+'">'+
      '<div class="lin" style="padding:0"><span style="display:flex;align-items:center;gap:8px"><span class="bolita" style="--c:'+esc(p.color)+'"></span>'+esc(p.nombre)+
      ' <span class="nota">× '+suyas.length+'</span></span><span class="v">'+col(m)+'</span></div>'+
      '<div class="barra-pro" style="--c:'+esc(p.color)+'"><i style="width:'+pct+'%"></i></div></div>';
  }
  h += '<div class="lin tot"><span>Total del estudio</span><span class="v">'+col(totMes)+'</span></div></div>';

  const porLink = S.citas.filter(c=>c.origen==='link' && deVista(c) && c.fecha.slice(0,7)===mes && ['aprobada','completada'].includes(c.estado));
  h += '<div style="height:14px"></div>';
  h += '<div class="destacado"><div class="et" style="font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acento)">Citas que entraron solas</div>'+
    '<div class="v">'+porLink.length+'</div>'+
    '<div class="nota">agendadas por el link este mes, sin que tocaran el teléfono. '+
    (porLink.length ? 'Son '+col(porLink.reduce((s,c)=>s+c.total,0))+' coordinados sin escribir un mensaje.' : 'Cuando alguien reserve por el link, se cuenta acá.')+'</div></div>';

  h += '<div class="rot">Desglose del mes por servicio'+esc(quien)+'</div>';
  const cuentas = {};
  for(const c of delMes){
    for(const s of c.servicios){
      const n = nomServ(s);                           // el esmaltado de manos y el de pies, separados
      cuentas[n] = cuentas[n] || {n:0,m:0};
      cuentas[n].n++; cuentas[n].m += s.precio;
    }
  }
  let extras = 0, extrasSinAnotar = 0;
  for(const c of delMes){
    extras += c.extrasCobrado || 0;
    for(const a of (c.adicionales||[])) if(a.precio != null) extras += a.precio*a.cant;
    if(tieneConsulta(c) && !c.extrasCobrado) extrasSinAnotar++;
  }
  const filas = Object.entries(cuentas).sort((a,b)=>b[1].m-a[1].m);
  if(!filas.length && !extras) h += vacio('Todavía no hay citas completadas este mes.','hoja');
  else{
    h += '<div class="card">';
    for(const [n,d] of filas) h += '<div class="lin"><span>'+esc(n)+' <span class="nota">× '+d.n+'</span></span><span class="v">'+col(d.m)+'</span></div>';
    h += '<div class="lin sub"><span>Extras (relieves, aerógrafo, efectos)</span><span class="v">'+col(extras)+'</span></div>';
    h += '<div class="lin tot"><span>Total del mes</span><span class="v">'+col(sum(delMes))+'</span></div>';
    if(extrasSinAnotar) h += '<div class="nota" style="margin-top:8px">'+extrasSinAnotar+' cita'+(extrasSinAnotar>1?'s':'')+
      ' con extras sin el monto anotado. Se anota en la tarjeta de la cita, en Agenda.</div>';
    h += '</div>';
  }

  const dep = delMes.reduce((s,c)=>s+c.deposito,0);
  if(S.config.pideDeposito || dep){
    h += '<div class="rot">Cómo entró la plata este mes</div>';
    h += '<div class="card">'+
      '<div class="lin"><span>Adelantado por SINPE (depósitos)</span><span class="v">'+col(dep)+'</span></div>'+
      '<div class="lin"><span>Cobrado en el estudio</span><span class="v">'+col(sum(delMes)-dep)+'</span></div>'+
      '<div class="lin tot"><span>Total</span><span class="v">'+col(sum(delMes))+'</span></div>'+
      '<div class="nota" style="margin-top:10px">Los depósitos ya estaban en la cuenta antes de que la clienta llegara.</div>'+
    '</div>';
  }
  return h;
}

  // orden importa: cada cita respeta las anteriores de su misma profesional

function pintar(){
  let dentro;
  if(V.pantalla === 'admin')        dentro = verAdmin();
  else if(V.pantalla === 'reserva') dentro = verCliente();
  else                              dentro = verInicio();
  // la agenda necesita más ancho en semana y mes, y en el día con todas las profesionales en columnas
  const enAgenda = V.pantalla === 'admin' && V.admin.tab === 'agenda';
  const columnas = enAgenda && ((V.admin.vista || 'dia') !== 'dia' || (V.admin.prof === 'todas' && profsActivas().length > 1));
  // la parte pública tiene su propio estilo (body.pub). La portada usa todo el ancho en computadora.
  const publica = V.pantalla !== 'admin';
  document.body.classList.toggle('pub', publica);
  document.getElementById('app').innerHTML = publica
    ? '<div class="v-marco'+(V.pantalla === 'inicio' ? ' v-inicio' : '')+'">'+dentro+'</div>'
    : '<div class="marco ancho'+(columnas?' muy-ancho':'')+'">'+dentro+'</div>';
  marcarNav();
}
function tic(){
  const cambio = liberarExpiradas();
  // Solo se repinta si el vencimiento afecta lo que hay en pantalla; así no
  // se pierde el foco de un campo que se esté escribiendo en ese segundo.
  if(cambio && (V.pantalla === 'admin' || V.paso === 6)){
    pintar();
    return;
  }
  for(const el of document.querySelectorAll('[data-cuenta]')){
    const c = S.citas.find(x=>x.id===el.getAttribute('data-cuenta'));
    if(c) el.textContent = cuenta(c.apartadoHasta);
  }
}

(function inicio(){
  S = cargar();
  if(!S){ S = datosIniciales(); sembrar(); guardar(); }
  else {
    // completa datos que falten de versiones anteriores del archivo
    const base = datosIniciales();
    for(const k in base.config) if(S.config[k] === undefined) S.config[k] = base.config[k];
    if(!S.citas) S.citas = [];
    if(!S.registro) S.registro = [];
    // versión anterior: los servicios no traían "admite diseño"; se toma del menú base
    // versión anterior: los servicios no traían las reglas del menú (incluye, grupo, noCon)
    for(const s of S.servicios){
      const b = base.servicios.find(x => x.id === s.id);
      if(b) for(const k of ['incluye','grupo','noCon']) if(s[k] === undefined && b[k] !== undefined) s[k] = b[k];
    }
    for(const s of S.servicios) if(s.admiteDisenio === undefined){
      const b = base.servicios.find(x => x.id === s.id);
      s.admiteDisenio = b ? b.admiteDisenio : true;
    }
    // versión anterior: "días libres" pasan a ser excepciones de "no trabaja"
    for(const p of S.profesionales){
      p.excepciones = p.excepciones || {};
      p.pausas = p.pausas || {};
      for(const f of (p.fechasBloqueadas || [])) if(!p.excepciones[f]) p.excepciones[f] = [];
      delete p.fechasBloqueadas;
    }
  }
  V.admin.fecha = hoyCR();
  V.paso = 1;
  liberarExpiradas();
  pintar();
  setInterval(tic, 1000);
  window.addEventListener('scroll', marcarNav, {passive:true});
  // si la agenda cambia en otra pestaña, esta se entera
  window.addEventListener('storage', e => {
    if(e.key !== LLAVE) return;
    sincronizar();
    if(V.pantalla === 'admin' || V.paso === 3 || V.paso === 4) pintar();
  });
})();
</script>
